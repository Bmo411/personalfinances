x-backend: &backend
  build:
    context: ./backend
  restart: unless-stopped
  environment: &environment
    DB_NAME: ${DB_NAME}
    DB_USER: ${DB_USER}
    DB_PASSWORD: ${DB_PASSWORD}
    DB_HOST: ${DB_HOST}
    DB_PORT: ${DB_PORT:-5432}
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Configure DJANGO_SECRET_KEY in Coolify}
    DEBUG: "False"
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-finance.blueberrieslab.com,backend,localhost,127.0.0.1}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://finance.blueberrieslab.com}
    PUBLIC_URL: https://finance.blueberrieslab.com
  networks:
    - coolify

networks:
  coolify:
    external: true

services:
  backend:
    <<: *backend
    command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate --noinput && gunicorn --bind 0.0.0.0:8000 config.wsgi:application"
    expose:
      - '8000'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.finance-api.rule=Host(`finance.blueberrieslab.com`) && (PathPrefix(`/api`) || PathPrefix(`/admin`) || PathPrefix(`/static`))"
      - "traefik.http.routers.finance-api.entrypoints=http,https"
      - "traefik.http.services.finance-api.loadbalancer.server.port=8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/
    restart: unless-stopped
    expose:
      - '80'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.finance.rule=Host(`finance.blueberrieslab.com`)"
      - "traefik.http.routers.finance.entrypoints=http,https"
      - "traefik.http.services.finance.loadbalancer.server.port=80"

  mcp:
    <<: *backend
    command: python -m uvicorn mcp_server:app --host 0.0.0.0 --port 8002 --no-access-log
    environment:
      <<: *environment
      INTERNAL_API_URL: http://backend:8000/api/integrations/
    expose:
      - '8002'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.finance-mcp.rule=Host(`finance.blueberrieslab.com`) && PathPrefix(`/mcp`)"
      - "traefik.http.routers.finance-mcp.entrypoints=http,https"
      - "traefik.http.services.finance-mcp.loadbalancer.server.port=8002"

  scheduler:
    <<: *backend
    command: python manage.py run_scheduler
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import time; from pathlib import Path; assert time.time() - Path('/tmp/life-scheduler-heartbeat').stat().st_mtime < 240"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 180s
